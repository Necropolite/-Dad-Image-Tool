name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Record resolved dependencies
        shell: pwsh
        run: python -m pip freeze | Sort-Object | Set-Content dependency-snapshot.txt -Encoding ascii

      - name: Check Python syntax
        run: python -m compileall -q app.py history.py history_window.py main.py ui_layout.py update_ui.py updater.py version.py watcher.py watcher_processing.py watcher_support.py tests tools

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with core coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m
          python -m coverage xml

      - name: Generate review fixtures
        run: python tools/generate_review_fixtures.py review-fixtures

      - name: Build packaged application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --collect-all pillow_heif main.py
          if (-not (Test-Path "dist\Dad Image Tool.exe")) {
            throw "PyInstaller did not create Dad Image Tool.exe"
          }

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: dad-image-tool-review-evidence
          if-no-files-found: error
          path: |
            dependency-snapshot.txt
            coverage.xml
            review-fixtures/
            dist/Dad Image Tool.exe
