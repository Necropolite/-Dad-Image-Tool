name: Build Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

permissions:
  contents: write

env:
  PYTHONPATH: internal/src

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and verify application version
        id: version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path internal/src/version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION was not found" }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tagVersion = "${{ github.ref_name }}".TrimStart('v')
            if ($appVersion -ne $tagVersion) { throw "Tag version $tagVersion does not match APP_VERSION $appVersion" }
          }

          if ("${{ github.ref }}".StartsWith("refs/heads/release/")) {
            $branchVersion = "${{ github.ref_name }}".Substring(8).TrimStart('v')
            if ($appVersion -ne $branchVersion) { throw "Release branch version $branchVersion does not match APP_VERSION $appVersion" }
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r internal/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q internal/src tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Dad Image Tool
        shell: pwsh
        run: |
          python internal/src/build_version_info.py version_info.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --version-file "version_info.txt" --collect-all pillow_heif --collect-all zipfile64 --collect-all inflate64 --collect-all pymupdf internal/src/main.py

      - name: Smoke-test packaged Dad Image Tool
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Dad Image Tool.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Dad Image Tool failed its startup smoke test with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup program
        shell: pwsh
        run: |
          python internal/src/build_installer_config.py
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer\DAD.iss"
          if (-not (Test-Path "installer-output\Dad-Image-Tool-Setup.exe")) { throw "Dad-Image-Tool-Setup.exe was not created" }
          $hash = (Get-FileHash "installer-output\Dad-Image-Tool-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Dad-Image-Tool-Setup.exe" | Set-Content "installer-output\Dad-Image-Tool-Setup.exe.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.app_version }}
          name: Dad Image Tool v${{ steps.version.outputs.app_version }}
          target_commitish: ${{ github.sha }}
          files: |
            installer-output/Dad-Image-Tool-Setup.exe
            installer-output/Dad-Image-Tool-Setup.exe.sha256
          generate_release_notes: true
