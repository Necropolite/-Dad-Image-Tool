name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build application
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all bs4 main.py
          Copy-Item "dist\Dad Image Tool.exe" "Dad-Image-Tool.exe"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Dad-Image-Tool.exe
          generate_release_notes: true
