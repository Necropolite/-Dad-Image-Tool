name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION was not found in version.py" }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($appVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match APP_VERSION $appVersion"
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py build_installer_config.py build_version_info.py history.py history_window.py main.py ui_layout.py update_ui.py updater.py version.py watcher.py watcher_processing.py watcher_support.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Dad Image Tool
        shell: pwsh
        run: |
          python build_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --version-file "version_info.txt" --collect-all pillow_heif main.py
          Copy-Item "dist\Dad Image Tool.exe" "Dad-Image-Tool.exe"
          $hash = (Get-FileHash "Dad-Image-Tool.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Dad-Image-Tool.exe" | Set-Content "Dad-Image-Tool.exe.sha256" -Encoding ascii

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build D.A.D. setup program
        shell: pwsh
        run: |
          python build_installer_config.py
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer\DAD.iss"
          if (-not (Test-Path "installer-output\DAD-Setup.exe")) { throw "DAD-Setup.exe was not created" }
          $hash = (Get-FileHash "installer-output\DAD-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DAD-Setup.exe" | Set-Content "installer-output\DAD-Setup.exe.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-output/DAD-Setup.exe
            installer-output/DAD-Setup.exe.sha256
            Dad-Image-Tool.exe
            Dad-Image-Tool.exe.sha256
          generate_release_notes: true
