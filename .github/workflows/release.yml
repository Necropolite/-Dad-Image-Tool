name: Build D.A.D. Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $versionLine = Select-String -Path version.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw "APP_VERSION was not found in version.py" }
          $appVersion = $versionLine.Matches[0].Groups[1].Value
          if ($appVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "APP_VERSION must use major.minor.patch numbers"
          }
          $expectedTag = "v$appVersion"
          if ("${{ github.ref_name }}" -ne $expectedTag) {
            throw "Tag ${{ github.ref_name }} does not match expected tag $expectedTag"
          }

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q app.py history.py history_window.py main.py ui_layout.py update_ui.py updater.py version.py watcher.py watcher_processing.py watcher_support.py tests tools

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with core coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m

      - name: Generate D.A.D. Windows version information
        run: python tools/generate_version_info.py generated/Dad-Image-Tool-Version.txt

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --version-file "generated\Dad-Image-Tool-Version.txt" --collect-all pillow_heif main.py
          Copy-Item "dist\Dad Image Tool.exe" "Dad-Image-Tool.exe"
          $hash = (Get-FileHash "Dad-Image-Tool.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Dad-Image-Tool.exe" | Set-Content "Dad-Image-Tool.exe.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "D.A.D. ${{ github.ref_name }} — Dad Image Tool"
          files: |
            Dad-Image-Tool.exe
            Dad-Image-Tool.exe.sha256
          generate_release_notes: true
