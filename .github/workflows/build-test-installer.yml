name: Build Dad Image Tool Test Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONPATH: internal/src

jobs:
  build-windows-installer:
    if: ${{ !contains(github.event.head_commit.message || '', '[setup build]') }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r internal/requirements.txt

      - name: Check Python syntax
        id: syntax
        run: python -m compileall -q internal/src tests

      - name: Run automated tests
        id: tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "internal/ci-test-output.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Dad Image Tool
        id: package
        shell: pwsh
        run: |
          python internal/src/build_version_info.py version_info.txt
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Dad Image Tool" --version-file "version_info.txt" --collect-all pillow_heif --collect-all zipfile64 --collect-all inflate64 --collect-all pymupdf internal/src/main.py

      - name: Smoke-test packaged Dad Image Tool
        id: smoke
        shell: pwsh
        run: |
          $exe = "dist\Dad Image Tool\Dad Image Tool.exe"
          if (-not (Test-Path $exe)) { throw "Packaged Dad Image Tool executable was not created" }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Dad Image Tool failed its startup smoke test with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        id: inno
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup program
        id: setup
        shell: pwsh
        run: |
          python internal/src/build_installer_config.py
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer\DAD.iss"
          if (-not (Test-Path "installer-output\Dad-Image-Tool-Setup.exe")) { throw "Dad-Image-Tool-Setup.exe was not created" }
          $hash = (Get-FileHash "installer-output\Dad-Image-Tool-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Dad-Image-Tool-Setup.exe" | Set-Content "installer-output\Dad-Image-Tool-Setup.exe.sha256" -Encoding ascii

      - name: Smoke-test installed Dad Image Tool and upgrade cleanup
        id: installed_smoke
        shell: pwsh
        run: |
          $installer = Resolve-Path "installer-output\Dad-Image-Tool-Setup.exe"
          function Run-Setup {
            $setupProcess = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
            if ($setupProcess.ExitCode -ne 0) { throw "Dad Image Tool setup failed with exit code $($setupProcess.ExitCode)" }
          }

          Run-Setup
          $installedRoot = Join-Path $env:LOCALAPPDATA "Dad Image Tool"
          $installedExe = Join-Path $installedRoot "Dad Image Tool.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed Dad Image Tool executable was not found" }
          $appProcess = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($appProcess.ExitCode -ne 0) { throw "Installed Dad Image Tool failed its startup smoke test with exit code $($appProcess.ExitCode)" }

          $staleRuntime = Join-Path $installedRoot "_internal\obsolete-runtime.tmp"
          New-Item -ItemType Directory -Path (Split-Path $staleRuntime) -Force | Out-Null
          Set-Content -Path $staleRuntime -Value "obsolete runtime" -Encoding ascii
          $staleUpdate = Join-Path $installedRoot "Dad Image Tool.exe.update"
          $staleBackup = Join-Path $installedRoot "Dad Image Tool.exe.backup"
          Set-Content -Path $staleUpdate -Value "obsolete update" -Encoding ascii
          Set-Content -Path $staleBackup -Value "obsolete backup" -Encoding ascii

          $picturesRoot = [Environment]::GetFolderPath("MyPictures")
          $userData = Join-Path $picturesRoot "Dad Image Tool\Finished\upgrade-preservation.txt"
          New-Item -ItemType Directory -Path (Split-Path $userData) -Force | Out-Null
          Set-Content -Path $userData -Value "preserve me" -Encoding ascii

          Run-Setup
          if (Test-Path $staleRuntime) { throw "Upgrade left an obsolete runtime file behind" }
          if (Test-Path $staleUpdate) { throw "Upgrade left an obsolete updater file behind" }
          if (Test-Path $staleBackup) { throw "Upgrade left an obsolete backup file behind" }
          if (-not (Test-Path $userData)) { throw "Upgrade removed user data from Pictures" }
          if (-not (Test-Path $installedExe)) { throw "Upgraded Dad Image Tool executable was not found" }
          $upgradedProcess = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($upgradedProcess.ExitCode -ne 0) { throw "Upgraded Dad Image Tool failed its startup smoke test with exit code $($upgradedProcess.ExitCode)" }
          Remove-Item $userData -Force

      - name: Upload test installer
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dad-Image-Tool-Test-Installer
          path: |
            installer-output/Dad-Image-Tool-Setup.exe
            installer-output/Dad-Image-Tool-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish setup executable at repository root
        id: publish
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          Copy-Item "installer-output\Dad-Image-Tool-Setup.exe" "Dad-Image-Tool-Setup.exe" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Dad-Image-Tool-Setup.exe"
          if (git diff --cached --quiet) {
            Write-Host "Root setup executable is already current."
            exit 0
          }
          git commit -m "Update root setup executable [setup build]"
          git push

      - name: Record failed build stage
        if: failure() && steps.checkout.outcome == 'success' && github.event_name == 'push'
        shell: pwsh
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INNO_OUTCOME: ${{ steps.inno.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALLED_SMOKE_OUTCOME: ${{ steps.installed_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          @"
          Build commit: ${{ github.sha }}
          Python: $env:PYTHON_OUTCOME
          Dependencies: $env:DEPS_OUTCOME
          Syntax: $env:SYNTAX_OUTCOME
          Tests: $env:TESTS_OUTCOME
          Package: $env:PACKAGE_OUTCOME
          Packaged smoke test: $env:SMOKE_OUTCOME
          Inno Setup: $env:INNO_OUTCOME
          Setup build: $env:SETUP_OUTCOME
          Installed/upgrade smoke test: $env:INSTALLED_SMOKE_OUTCOME
          Artifact: $env:ARTIFACT_OUTCOME
          Root publish: $env:PUBLISH_OUTCOME
          "@ | Set-Content "internal/ci-last-failure.txt" -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "internal/ci-last-failure.txt"
          if (Test-Path "internal/ci-test-output.txt") { git add -- "internal/ci-test-output.txt" }
          git commit -m "Record Windows build failure [setup build]"
          git push
