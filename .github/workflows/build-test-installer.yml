name: Build Test Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py build_installer_config.py build_version_info.py history.py history_window.py main.py ui_layout.py update_ui.py updater.py version.py watcher.py watcher_processing.py watcher_support.py tests

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Build Dad Image Tool
        shell: pwsh
        run: |
          python build_version_info.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Dad Image Tool" --version-file "version_info.txt" --collect-all pillow_heif main.py

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build D.A.D. setup program
        shell: pwsh
        run: |
          python build_installer_config.py
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer\DAD.iss"
          if (-not (Test-Path "installer-output\DAD-Setup.exe")) { throw "DAD-Setup.exe was not created" }
          $hash = (Get-FileHash "installer-output\DAD-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DAD-Setup.exe" | Set-Content "installer-output\DAD-Setup.exe.sha256" -Encoding ascii

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: DAD-Test-Installer
          path: |
            installer-output/DAD-Setup.exe
            installer-output/DAD-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
