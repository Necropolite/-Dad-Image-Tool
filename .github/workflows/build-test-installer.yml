name: Build Dad Image Tool Test Installer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  PYTHONPATH: internal/src

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        id: deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r internal/requirements.txt

      - name: Check Python syntax
        id: syntax
        run: python -m compileall -q internal/src tests

      - name: Run automated tests
        id: tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\ci-test-output.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Dad Image Tool
        id: package
        shell: pwsh
        run: |
          python internal/src/build_version_info.py version_info.txt
          python internal/src/build_icon.py Dad-Image-Tool.ico
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name "Dad Image Tool" --icon "Dad-Image-Tool.ico" --version-file "version_info.txt" --collect-all pillow_heif --collect-all zipfile64 --collect-all inflate64 --collect-all pymupdf --collect-all extract_msg internal/src/main.py

      - name: Smoke-test packaged Dad Image Tool
        id: smoke
        shell: pwsh
        run: |
          $exe = "dist\Dad Image Tool\Dad Image Tool.exe"
          if (-not (Test-Path $exe)) { throw "Packaged Dad Image Tool executable was not created" }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged Dad Image Tool failed its startup smoke test with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        id: inno
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup program
        id: setup
        shell: pwsh
        run: |
          python internal/src/build_installer_config.py
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found" }
          & $iscc.FullName "installer\DAD.iss"
          if (-not (Test-Path "installer-output\Dad-Image-Tool-Setup.exe")) { throw "Dad-Image-Tool-Setup.exe was not created" }
          $hash = (Get-FileHash "installer-output\Dad-Image-Tool-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Dad-Image-Tool-Setup.exe" | Set-Content "installer-output\Dad-Image-Tool-Setup.exe.sha256" -Encoding ascii

      - name: Validate previous-release upgrade, repair, and uninstall
        id: installed_smoke
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./internal/scripts/test_installer_upgrade.ps1 -CandidateInstaller "installer-output\Dad-Image-Tool-Setup.exe"

      - name: Upload test installer
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dad-Image-Tool-Test-Installer
          path: |
            installer-output/Dad-Image-Tool-Setup.exe
            installer-output/Dad-Image-Tool-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Record failed build stage
        if: failure() && steps.checkout.outcome == 'success'
        shell: pwsh
        env:
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          INNO_OUTCOME: ${{ steps.inno.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALLED_SMOKE_OUTCOME: ${{ steps.installed_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          @"
          Build commit: ${{ github.sha }}
          Python: $env:PYTHON_OUTCOME
          Dependencies: $env:DEPS_OUTCOME
          Syntax: $env:SYNTAX_OUTCOME
          Tests: $env:TESTS_OUTCOME
          Package: $env:PACKAGE_OUTCOME
          Packaged smoke test: $env:SMOKE_OUTCOME
          Inno Setup: $env:INNO_OUTCOME
          Setup build: $env:SETUP_OUTCOME
          Published-release upgrade/repair/uninstall: $env:INSTALLED_SMOKE_OUTCOME
          Artifact: $env:ARTIFACT_OUTCOME
          "@ | Set-Content "$env:RUNNER_TEMP\ci-last-failure.txt" -Encoding utf8

      - name: Upload failure diagnostics
        if: failure() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Dad-Image-Tool-CI-Diagnostics
          path: |
            ${{ runner.temp }}/ci-last-failure.txt
            ${{ runner.temp }}/ci-test-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Report validation success
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=success `
            -f context="dad-image-tool/windows-validation" `
            -f description="Windows tests, real upgrade, repair, and uninstall checks passed" `
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Report validation failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" `
            -f state=failure `
            -f context="dad-image-tool/windows-validation" `
            -f description="Dad Image Tool Windows validation failed" `
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
