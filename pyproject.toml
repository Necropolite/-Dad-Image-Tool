[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build", "dist", ".venv", "review-fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = [
    "app",
    "history",
    "updater",
    "watcher_processing",
    "watcher_support",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
